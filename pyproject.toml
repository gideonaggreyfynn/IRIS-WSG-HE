[project]
name = "iris-wsg-he"
version = "0.1.0"
description = "Hesse Groundwater Protection Zones Ingestion Module"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0.0",
    "pandas>=2.2.0",
    "OWSLib>=0.31.0",
    "SQLAlchemy>=2.0.0",
    "GeoAlchemy2>=0.15.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.6.0",
    "shapely>=2.0.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# --- THE FIX IS HERE ---
# This tells pip to ONLY install the "app" folder, 
# ignoring "tests", "alembic", and "fixtures".
[tool.setuptools.packages.find]
include = ["app*"]